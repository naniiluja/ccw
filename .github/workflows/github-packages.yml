# Publishes the npm packages to GitHub Packages as @<owner>/ccw-gateway, so the
# repository page lists them. npmjs.com gets the same packages without a scope.
# scripts/check.sh (gofmt, go vet, staticcheck, gocyclo, go test -race with the
# architecture and size tests) runs on every push to master and every pull
# request, and a v* tag publishes only after it passes.
name: GitHub Packages
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: be/go.mod
      - name: Check (same gates as local scripts/check.sh)
        run: bash scripts/check.sh
  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: be/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'
      - name: Build
        run: NPM_SCOPE="@${{ github.repository_owner }}/" ./scripts/npm-build.sh dist/npm
      - name: Publish, platforms first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for d in dist/npm/ccw-gateway-*/ dist/npm/ccw-gateway/; do
            npm publish "$d"
          done
