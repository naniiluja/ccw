# staticcheck configuration, read by scripts/check.sh and CI.
# "inherit" keeps staticcheck's default set, which already includes ST1005
# (error string style) and ST1012 (error variable naming). ST1003 (MixedCaps
# and initialisms such as ID, URL, API) and ST1016 (consistent receiver
# names) are off by default and turned on here. Measured before enabling with
# staticcheck 2026.2.1 (v0.8.1): ST1003 1 (fixed), ST1005 0, ST1012 0, ST1016 0.
checks = ["inherit", "ST1003", "ST1016"]
